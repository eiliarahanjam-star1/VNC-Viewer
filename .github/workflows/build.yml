
name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VNCViewer_AndroidStudio.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

          
      - name: Extract project
        run: |
          unzip -o VNCViewer_AndroidStudio.zip
          echo "=== Current directory ==="
          pwd
          echo "=== Extracted files and folders ==="
          ls -la
          echo "=== Gradle project files ==="
          find . -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print

      - name: Build APK
        run: |
          echo "=== Project folders ==="
          find . -maxdepth 5 -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print
          echo "=== Build files ==="
          find . -maxdepth 5 -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -print
          echo "=== ZIP files ==="
          ls -la

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VNCViewer-debug-APK
          path: VNCViewer/app/build/outputs/apk/debug/app-debug.apk
